name: Proponer un recurso
description: Envía un script, modelo, herramienta o tutorial para revisión.
title: "[Recurso]: "
labels: ["propuesta-comunidad"]
body:
  - type: markdown
    attributes:
      value: |
        Las propuestas se revisan antes de publicarse.
        No incluyas contraseñas, tokens ni información personal.
  - type: input
    id: nombre
    attributes:
      label: Nombre del recurso
      placeholder: "Ej. Sistema de inventario"
    validations:
      required: true
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de recurso
      options:
        - Script Lua/Luau
        - Modelo Roblox
        - Herramienta
        - Tutorial
        - Otro
    validations:
      required: true
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción y uso
    validations:
      required: true
  - type: input
    id: enlace
    attributes:
      label: Enlace al recurso
      description: Enlace a GitHub, Roblox, YouTube u otra fuente segura.
      placeholder: "https://..."
    validations:
      required: true
  - type: input
    id: alias
    attributes:
      label: Alias público del creador
      description: No incluyas nombre legal, correo ni datos de contacto.
    validations:
      required: true
  - type: dropdown
    id: derechos
    attributes:
      label: Derechos y permiso
      options:
        - "Es mío o tengo permiso/licencia para compartirlo"
        - "No estoy seguro; necesita aclaración"
    validations:
      required: true
  - type: checkboxes
    id: confirmaciones
    attributes:
      label: Confirmaciones
      options:
        - label: No contiene datos personales, contraseñas, tokens ni código dañino.
          required: true
        - label: Entiendo que se revisará y puede no publicarse.
          required: true
          
